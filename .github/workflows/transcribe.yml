# Transcribes pending sermons with faster-whisper and pushes each transcript
# directly to the private Sermon-Note-Content repo, then commits this repo's own
# ledger update (transcription_status/transcript_hash/content_path) to data/.
#
# Runs independently of poll.yml: Whisper transcription cannot fit inside that
# job's 4-minute budget. --limit bounds each run's cost per church (spec 0003,
# ADR-0004); raise the schedule's frequency or workflow_dispatch's limit to work
# down a backlog faster, rather than removing the cap.
#
# Sharding (ADR-0005) splits one bounded run into parallel matrix legs, each a
# disjoint slice of the same selection (poller/transcriber.py
# --shard-index/--shard-count). The shard count is not supplied at dispatch —
# the `plan` job below computes it from the actual number of sermons in scope
# (poller.transcriber --print-shard-count), so a routine tick with 0-1 pending
# sermons runs 0-1 shards and a larger backlog parallelizes itself.
#
# Two modes (ADR-0022). `pending` (the scheduled backstop tick, poll's dispatches, the default)
# transcribes new sermons. `retranscribe-stale` re-transcribes done sermons whose
# recorded decoding profile differs from the running one, replacing them in Content
# by compare-and-swap; it runs only from a workflow_dispatch: the canary (with
# `guids`) and the unattended pass, which an external scheduler (cron-job.org) dispatches
# hourly with `mode` and `limit` set, as for poll.yml (ADR-0002, ADR-0011) — GitHub's own
# cron is delayed or dropped under load. Disabling that job is the pass's off switch.
# Each mode has its own concurrency group, so new sermons never queue behind a
# multi-hour pass, and the `verify` job checks every ledger hash against Content after a
# retranscribe-stale run.
#
# The shards run the whole Whisper stack, so none holds the deploy key that bypasses main's
# ruleset: each uploads its data/ writes, and the `push` job, which installs nothing, merges
# every shard's onto the tip and pushes them once the matrix is done (ADR-0027).

name: Transcribe sermons

on:
  schedule:
    # Backstop for poll's dispatches, not the primary trigger. UTC: 01:07 on Mon, Tue,
    # Thu and Sat is 5:07pm PST on the Sunday, Monday, Wednesday and Friday before.
    - cron: "7 1 * * 1,2,4,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "pending: transcribe new sermons. retranscribe-stale: re-transcribe stale-profile ones (ADR-0022)."
        type: choice
        options:
          - pending
          - retranscribe-stale
        default: pending
      limit:
        description: "Maximum sermons to transcribe this run, per selected church."
        type: number
        default: 5
      church:
        description: "Only transcribe this church (its key in the church table). Leave blank for every enabled church."
        type: string
        default: ""
      guids:
        description: "retranscribe-stale only: guids to narrow the pass to, separated by ';' (the canary)."
        type: string
        default: ""
      silence_guard:
        description: "retranscribe-stale with guids only: hallucination-silence threshold in seconds for this run, overriding the repo variable. 0 turns the guard off."
        type: string
        default: ""

# Separate from poll.yml's group: transcription and polling never need to block
# each other. Both still write data/ — see the push job below for how that race
# is handled. One group per mode: the modes select disjoint records (pending vs
# done), and a pass taking hours must not hold up a new sermon.
concurrency:
  group: transcribe-sermons-${{ inputs.mode || 'pending' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The run's mode and per-church limit, once for every job. The scheduled tick has no
  # inputs, so it is a pending run at the default limit; the re-transcription pass sets
  # both in its dispatch.
  TRANSCRIBE_MODE: ${{ inputs.mode || 'pending' }}
  LIMIT: ${{ inputs.limit || 5 }}
  CHURCH: ${{ inputs.church }}
  GUIDS: ${{ inputs.guids }}
  SILENCE_GUARD: ${{ inputs.silence_guard }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
  WHISPER_COMPUTE_TYPE: ${{ vars.WHISPER_COMPUTE_TYPE }}
  # Decoding knobs (spec 0003). All optional — an unset variable arrives as an empty
  # string, which poller/config.py reads as the default. WHISPER_DOMAIN_PROMPT=true
  # opts in to the per-sermon hotwords layer.
  WHISPER_BEAM_SIZE: ${{ vars.WHISPER_BEAM_SIZE }}
  WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${{ vars.WHISPER_CONDITION_ON_PREVIOUS_TEXT }}
  WHISPER_DOMAIN_PROMPT: ${{ vars.WHISPER_DOMAIN_PROMPT }}
  # A dispatch's silence_guard beats the variable, for the plan and every shard alike.
  WHISPER_HALLUCINATION_SILENCE_THRESHOLD: ${{ inputs.silence_guard || vars.WHISPER_HALLUCINATION_SILENCE_THRESHOLD }}
  CONTENT_REPO: ${{ vars.CONTENT_REPO }}
  # PIPELINE_DISPATCH_TOKEN lets poller/pipeline_dispatch.py trigger Sermon-Note-Pipeline's
  # pipeline.yml right after a sermon's transcript lands in Content (spec 0005, ADR-0009).
  # Best-effort: a dispatch failure is logged, never fails this job — Pipeline's own cron
  # still catches anything it misses. It also reads the church table from Pipeline's
  # config/churches.json (ADR-0016), which is not best-effort: without it every job here
  # fails.
  PIPELINE_REPO: ${{ vars.PIPELINE_REPO }}
  # Secrets are not set here: workflow env reaches every job. Each one is set on just the
  # steps whose code reads it, so no job, and no `pip install`, holds a token it never uses.

jobs:
  # Sizes the matrix `transcribe` fans out over from the actual backlog, not a
  # dispatch-time guess: runs the transcriber's own selection (--print-shard-count)
  # against this run's --limit/--church, so the shard count always matches the
  # number of sermons that will actually be processed.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.compute.outputs.mode }}
      max_parallel: ${{ steps.compute.outputs.max_parallel }}
      scheduled: ${{ steps.compute.outputs.scheduled }}
      shards: ${{ steps.compute.outputs.shards }}
      shard_count: ${{ steps.compute.outputs.shard_count }}
      ledger_sha: ${{ steps.compute.outputs.ledger_sha }}
    steps:
      # The branch tip as of now, not github.sha: a run queued behind another in
      # the concurrency group would otherwise plan from the ledger as it was when
      # it was queued, re-selecting sermons the run ahead of it already finished.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Count sermons in scope
        id: compute
        # TRANSCRIBE_MODE/LIMIT/CHURCH/GUIDS (workflow env) read as shell variables,
        # never interpolated directly into the script — `${{ inputs.x }}` inside
        # `run:` is text substitution before the shell sees it, so an unvalidated
        # dispatch input would otherwise run as code with access to every secret in
        # this job.
        env:
          RETRANSCRIBE_MAX_PARALLEL: ${{ vars.RETRANSCRIBE_MAX_PARALLEL }}
          PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          mode="$TRANSCRIBE_MODE"
          case "$mode" in
            pending | retranscribe-stale) ;;
            *)
              echo "::error::mode '$mode' is not pending or retranscribe-stale"
              exit 1
              ;;
          esac
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::LIMIT input '$LIMIT' is not a positive integer"
            exit 1
          fi
          if [ -n "$CHURCH" ] && ! [[ "$CHURCH" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "::error::CHURCH input '$CHURCH' is not a valid church key"
            exit 1
          fi
          args=(--limit "$LIMIT")
          if [ -n "$CHURCH" ]; then
            args+=(--church "$CHURCH")
          fi
          # Pending: every shard at once. The pass: capped, so it leaves room in the account's
          # concurrent-job limit for poll, pending transcription, Pipeline and CI.
          max_parallel=256
          if [ "$mode" = "retranscribe-stale" ]; then
            max_parallel="${RETRANSCRIBE_MAX_PARALLEL:-32}"
            if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]] || [ "$max_parallel" -gt 256 ]; then
              echo "::error::RETRANSCRIBE_MAX_PARALLEL '$max_parallel' is not a whole number from 1 to 256"
              exit 1
            fi
            args+=(--retranscribe-stale)
            IFS=';' read -ra guid_list <<< "$GUIDS"
            for guid in "${guid_list[@]}"; do
              if ! [[ "$guid" =~ ^[A-Za-z0-9][A-Za-z0-9\ ,._:/=?\&%+~-]*$ ]]; then
                echo "::error::GUIDS entry '$guid' is not a ledger guid"
                exit 1
              fi
              args+=(--guid "$guid")
            done
          elif [ -n "$GUIDS" ]; then
            echo "::error::GUIDS applies only to mode retranscribe-stale"
            exit 1
          fi
          # Against an unnarrowed run the override would make every record decoded under the
          # default stale, and the pass would re-transcribe them all under it.
          if [ -n "$SILENCE_GUARD" ]; then
            if [ -z "$GUIDS" ]; then
              echo "::error::SILENCE_GUARD applies only to a retranscribe-stale run that names GUIDS"
              exit 1
            fi
            if ! [[ "$SILENCE_GUARD" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::SILENCE_GUARD '$SILENCE_GUARD' is not a number of seconds"
              exit 1
            fi
            # The workflow env falls back to the variable when it reads the input as false;
            # a pass that ran under the wrong profile would exit zero.
            if [ "$WHISPER_HALLUCINATION_SILENCE_THRESHOLD" != "$SILENCE_GUARD" ]; then
              echo "::error::SILENCE_GUARD '$SILENCE_GUARD' did not reach the decoder setting"
              exit 1
            fi
            echo "Silence guard overridden to ${SILENCE_GUARD}s for this run (repo variable ignored)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # The unattended pass is a re-transcription dispatch that names no guids; the
          # canary names them. Only the pass owes the absence alerts (verify job).
          scheduled=false
          if [ "$mode" = "retranscribe-stale" ] && [ -z "$GUIDS" ]; then
            scheduled=true
          fi
          count=$(python -m poller.transcriber "${args[@]}" --print-shard-count)
          # GitHub refuses a matrix of more than 256 jobs, with an error that names no cause.
          if [ "$count" -gt 256 ]; then
            echo "::error::$count sermons in scope; lower LIMIT so the matrix stays within 256 shards"
            exit 1
          fi
          shards="["
          for ((i = 0; i < count; i++)); do
            shards+="$i"
            if [ "$i" -lt "$((count - 1))" ]; then
              shards+=","
            fi
          done
          shards+="]"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"
          echo "scheduled=$scheduled" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_count=$count" >> "$GITHUB_OUTPUT"
          echo "ledger_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  transcribe:
    name: Transcribe (shard ${{ matrix.shard }})
    needs: plan
    # An empty matrix fails the run even though every job that ran is green; skip
    # instead, so an idle tick stays green and a red run means something broke.
    if: ${{ needs.plan.outputs.shard_count != '0' }}
    runs-on: ubuntu-latest
    # Pending: GitHub's own 6h job cap. large-v3 run length varies enough that a
    # tighter fixed cap kept cutting runs off before they finished, and GitHub-hosted
    # minutes are unmetered for this public repo. Re-transcription: one sermon per
    # shard, and the longest benchmarked (48 min of audio, slowest runner) took about
    # 55 min, so 180 covers a 90-minute service with headroom.
    timeout-minutes: ${{ needs.plan.outputs.mode == 'retranscribe-stale' && 180 || 360 }}
    # One shard failing (a crashed runner, a terminal model error) must not cancel
    # the others — each is an independent slice of the backlog, per ADR-0005. The
    # plan sets how many run at once (vars.RETRANSCRIBE_MAX_PARALLEL for the pass).
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      # Pinned to the commit the plan job counted, so every shard partitions the same
      # selection even if poll.yml commits in between. That commit is also the base the
      # push job merges this shard's ledger writes against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ledger_sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # faster-whisper downloads model weights from the Hugging Face hub on first
      # use; caching them here means a scheduled run doesn't re-fetch on every
      # invocation (§13 unattended cost). Shared across shards: a cold cache means
      # each shard downloads once in parallel, a one-time cost, not a per-run one.
      - name: Cache Whisper model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Transcribe
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          # Read directly by huggingface_hub (faster-whisper's model download), not by our
          # own code — authenticates the weight download so it isn't subject to Hugging
          # Face's anonymous rate limit.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          # A transcript that trips a quality flag is emailed from this step (ADR-0023);
          # the same repository secrets poll.yml uses for discovery emails.
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Checked before any Whisper time is spent: a missing secret would otherwise
          # surface only on the first flagged transcript, as an alert nobody received.
          for var in NOTIFY_EMAIL_FROM NOTIFY_EMAIL_TO RESEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::notify secret $var is not set; transcript quality alerts cannot be sent"
              exit 1
            fi
          done
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::LIMIT input '$LIMIT' is not a positive integer"
            exit 1
          fi
          if [ -n "$CHURCH" ] && ! [[ "$CHURCH" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "::error::CHURCH input '$CHURCH' is not a valid church key"
            exit 1
          fi
          args=(--limit "$LIMIT" --shard-index "${{ matrix.shard }}" --shard-count "${{ needs.plan.outputs.shard_count }}")
          if [ -n "$CHURCH" ]; then
            args+=(--church "$CHURCH")
          fi
          # The same selection the plan counted, or the shards would partition a different list.
          if [ "$MODE" = "retranscribe-stale" ]; then
            args+=(--retranscribe-stale --summary-md "$GITHUB_STEP_SUMMARY")
            IFS=';' read -ra guid_list <<< "$GUIDS"
            for guid in "${guid_list[@]}"; do
              if ! [[ "$guid" =~ ^[A-Za-z0-9][A-Za-z0-9\ ,._:/=?\&%+~-]*$ ]]; then
                echo "::error::GUIDS entry '$guid' is not a ledger guid"
                exit 1
              fi
              args+=(--guid "$guid")
            done
          fi
          python -m poller.transcriber "${args[@]}"

      # Always, even if Transcribe exited non-zero (e.g. one sermon's model call failed
      # terminally): transcribe_church() writes each church's ledger before returning, and a
      # sermon already pushed to Content must reach the ledger or the next run re-selects it.
      - name: Stage ledger changes
        if: always()
        run: python -m poller.ledger_push stage "$RUNNER_TEMP/ledger"

      - name: Upload ledger changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ledger-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ledger
          if-no-files-found: error
          retention-days: 30

  # The only job holding DEPLOY_KEY: main's ruleset requires a PR from everyone else, and this
  # key is the one actor on its bypass list. So it installs nothing and runs this repo's code
  # without site-packages (`python -E -S`), and pushes only the allowlisted ledger files
  # (ADR-0027). It merges every shard's writes against the plan's commit by record and field,
  # so a rejected push re-merges onto the fresh tip; no Whisper call, no Content push. It runs
  # even on a cancelled run, so finished shards' Content pushes still reach the ledger; a
  # failed run is recovered by re-running this job, which re-merges the same artifacts.
  push:
    name: Push ledger
    needs: [plan, transcribe]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.shard_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # No pip cache: nothing is installed, and a cache a shard saved is not restored here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ledger-shard-*
          path: ${{ runner.temp }}/ledger

      - name: Push ledger update
        env:
          LEDGER_DIR: ${{ runner.temp }}/ledger
          EXPECTED: ${{ needs.plan.outputs.shard_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          attempts=3
          landed=false
          for attempt in $(seq 1 "$attempts"); do
            python -E -S -m poller.ledger_push apply "$LEDGER_DIR"
            git add data/
            python -E -S -m poller.ledger_push check-staged
            if git diff --cached --quiet; then
              echo "No transcription progress to record this run."
              landed=true
              break
            fi
            git commit -q -m "chore(data): record transcription progress [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              landed=true
              break
            fi
            echo "push rejected (attempt $attempt/$attempts); merging onto the latest $GITHUB_REF_NAME and retrying"
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
          done
          if [ "$landed" != true ]; then
            echo "::error::failed to push ledger update after $attempts attempts"
            exit 1
          fi
          found=$(find "$LEDGER_DIR" -name ledger-base | wc -l | tr -d ' ')
          if [ "$found" != "$EXPECTED" ]; then
            echo "::error::$found of $EXPECTED staged ledger artifacts arrived; the rest were not recorded"
            exit 1
          fi

  # After a re-transcription run: every done record's Content file must exist and hash
  # to its ledger transcript_hash, every replaced record must name its full profile, and
  # no guid may own two Content files (ADR-0022). A violation turns the run red and is
  # emailed. Reads main's tip, after the push job lands every shard's ledger writes. On
  # the unattended pass it also alerts on absence: nothing replaced in 24h while stale
  # sermons remain, and once when the backlog empties.
  verify:
    name: Verify ledger against Content
    needs: [plan, transcribe, push]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'retranscribe-stale' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Verify
        env:
          SCHEDULED: ${{ needs.plan.outputs.scheduled }}
          PLANNED: ${{ needs.plan.outputs.shard_count }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for var in NOTIFY_EMAIL_FROM NOTIFY_EMAIL_TO RESEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::notify secret $var is not set; re-transcription alerts cannot be sent"
              exit 1
            fi
          done
          args=(--summary-md "$GITHUB_STEP_SUMMARY")
          if [ "$SCHEDULED" = "true" ]; then
            args+=(--scheduled --planned "$PLANNED")
          fi
          python -m poller.verify_content "${args[@]}"

  # Publishes status/ingest.json for the web report (spec 0009): a projection of every
  # ledger, pushed to Content only when it changed. Every tick that planned — including
  # one with no shards, where `transcribe` and `push` are skipped — and after the ledger
  # push, so it reads main's tip rather than the plan's pinned commit.
  publish-status:
    name: Publish status
    needs: [plan, transcribe, push]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Publish status
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: python -m poller.status
