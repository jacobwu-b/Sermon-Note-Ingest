# Transcribes pending sermons with faster-whisper and pushes each transcript
# directly to the private Sermon-Note-Content repo, then commits this repo's own
# ledger update (transcription_status/transcript_hash/content_path) to data/.
#
# Runs independently of poll.yml: Whisper transcription cannot fit inside that
# job's 4-minute budget. --limit bounds each run's cost per church (spec 0003,
# ADR-0004); raise the schedule's frequency or workflow_dispatch's limit to work
# down a backlog faster, rather than removing the cap.
#
# Sharding (ADR-0005) splits one bounded run into parallel matrix legs, each a
# disjoint slice of the same selection (poller/transcriber.py
# --shard-index/--shard-count). The shard count is not supplied at dispatch —
# the `plan` job below computes it from the actual number of sermons in scope
# (poller.transcriber --print-shard-count), so a routine tick with 0-1 pending
# sermons runs 0-1 shards and a larger backlog parallelizes itself.

name: Transcribe sermons

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum sermons to transcribe this run, per selected church."
        type: number
        default: 5
      church:
        description: "Only transcribe this church (its CHURCHES key). Leave blank for every enabled church."
        type: string
        default: ""

# Separate from poll.yml's group: transcription and polling never need to block
# each other. Both still write data/ — see the push step below for how that race
# is handled.
concurrency:
  group: transcribe-sermons
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHURCHES: ${{ vars.CHURCHES }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
  WHISPER_COMPUTE_TYPE: ${{ vars.WHISPER_COMPUTE_TYPE }}
  # Decoding knobs (spec 0003). All optional — an unset variable arrives as an empty
  # string, which poller/config.py reads as the default. WHISPER_DOMAIN_PROMPT=false
  # is the kill switch for the per-sermon hotwords layer.
  WHISPER_BEAM_SIZE: ${{ vars.WHISPER_BEAM_SIZE }}
  WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${{ vars.WHISPER_CONDITION_ON_PREVIOUS_TEXT }}
  WHISPER_DOMAIN_PROMPT: ${{ vars.WHISPER_DOMAIN_PROMPT }}
  CONTENT_REPO: ${{ vars.CONTENT_REPO }}
  CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
  # Read directly by huggingface_hub (faster-whisper's model download), not by our own
  # code — authenticates the weight download so it isn't subject to Hugging Face's
  # anonymous rate limit.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # Lets poller/pipeline_dispatch.py trigger Sermon-Note-Pipeline's pipeline.yml
  # right after a sermon's transcript lands in Content (spec 0005, ADR-0009).
  # Best-effort: a dispatch failure is logged, never fails this job — Pipeline's
  # own cron still catches anything it misses.
  PIPELINE_REPO: ${{ vars.PIPELINE_REPO }}
  PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}

jobs:
  # Sizes the matrix `transcribe` fans out over from the actual backlog, not a
  # dispatch-time guess: runs the transcriber's own selection (--print-shard-count)
  # against this run's --limit/--church, so the shard count always matches the
  # number of sermons that will actually be processed.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
      shard_count: ${{ steps.compute.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Count sermons in scope
        id: compute
        # LIMIT/CHURCH read as shell variables, never interpolated directly
        # into the script — `${{ inputs.x }}` inside `run:` is text
        # substitution before the shell sees it, so an unvalidated dispatch
        # input would otherwise run as code with access to every secret in
        # this job.
        env:
          LIMIT: ${{ inputs.limit || 5 }}
          CHURCH: ${{ inputs.church }}
        run: |
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::LIMIT input '$LIMIT' is not a positive integer"
            exit 1
          fi
          if [ -n "$CHURCH" ] && ! [[ "$CHURCH" =~ ^[a-z_]*$ ]]; then
            echo "::error::CHURCH input '$CHURCH' is not a valid CHURCHES key"
            exit 1
          fi
          args=(--limit "$LIMIT")
          if [ -n "$CHURCH" ]; then
            args+=(--church "$CHURCH")
          fi
          count=$(python -m poller.transcriber "${args[@]}" --print-shard-count)
          shards="["
          for ((i = 0; i < count; i++)); do
            shards+="$i"
            if [ "$i" -lt "$((count - 1))" ]; then
              shards+=","
            fi
          done
          shards+="]"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_count=$count" >> "$GITHUB_OUTPUT"

  transcribe:
    name: Transcribe (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # No timeout-minutes: large-v3 run length varies enough that a fixed cap keeps
    # cutting runs off before they finish. Public repo — GitHub-hosted runner
    # minutes are unmetered, so the usual §13 cost-ceiling rationale doesn't apply;
    # GitHub's own default job cap (6h) still bounds a truly stuck runner.
    # One shard failing (a crashed runner, a terminal model error) must not cancel
    # the others — each is an independent slice of the backlog, per ADR-0005.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      # Deploy key authenticates this repo's own ledger push, same as poll.yml.
      # It is unrelated to CONTENT_REPO_TOKEN, which authenticates the separate
      # push to Sermon-Note-Content inside the transcriber itself.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # faster-whisper downloads model weights from the Hugging Face hub on first
      # use; caching them here means a scheduled run doesn't re-fetch on every
      # invocation (§13 unattended cost). Shared across shards: a cold cache means
      # each shard downloads once in parallel, a one-time cost, not a per-run one.
      - name: Cache Whisper model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Transcribe
        env:
          LIMIT: ${{ inputs.limit || 5 }}
          CHURCH: ${{ inputs.church }}
        run: |
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::LIMIT input '$LIMIT' is not a positive integer"
            exit 1
          fi
          if [ -n "$CHURCH" ] && ! [[ "$CHURCH" =~ ^[a-z_]*$ ]]; then
            echo "::error::CHURCH input '$CHURCH' is not a valid CHURCHES key"
            exit 1
          fi
          args=(--limit "$LIMIT" --shard-index "${{ matrix.shard }}" --shard-count "${{ needs.plan.outputs.shard_count }}")
          if [ -n "$CHURCH" ]; then
            args+=(--church "$CHURCH")
          fi
          echo "TRANSCRIBE_ARGS=${args[*]}" >> "$GITHUB_ENV"
          python -m poller.transcriber "${args[@]}"

      - name: Push ledger update
        # Always runs, even if Transcribe exited non-zero (e.g. one sermon's model
        # call failed terminally): transcribe_church() writes each church's ledger
        # to disk before returning, so one failure must not discard every other
        # church's progress. poll.yml also commits data/ on its own schedule, and
        # every other shard in this same matrix does too, so a rejected push here
        # is routine, not exceptional — a Whisper run can take tens of minutes,
        # long enough that at least one other writer almost always lands first.
        # On rejection, rebase this shard's already-committed ledger update onto
        # the fresh main rather than discarding it: the other writers' edits are
        # almost always different records in the same file, so this is a clean
        # 3-way merge, not a real conflict. Only a genuine conflict (two shards'
        # updates landing on the very same record) falls back to redoing this
        # shard's batch from scratch — the previously idempotent behavior — since
        # a sermon already "done" or already landed in Content is never re-marked
        # or re-pushed with new content. More shards means more concurrent
        # writers, so the retry budget scales with shard count (ADR-0005) rather
        # than staying fixed at 3.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          attempts="${{ needs.plan.outputs.shard_count }}"
          attempts=$((attempts + 1))
          if [ "$attempts" -lt 3 ]; then
            attempts=3
          fi
          python -m poller.store validate
          git add data/
          if git diff --cached --quiet; then
            echo "No transcription progress to record this run."
            exit 0
          fi
          git commit -m "chore(data): record transcription progress [skip ci]"
          for attempt in $(seq 1 "$attempts"); do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/$attempts); rebasing onto latest main and retrying"
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            echo "rebase conflicted; redoing this shard's batch on top of latest main"
            git rebase --abort
            git reset --hard origin/main
            python -m poller.transcriber $TRANSCRIBE_ARGS || true
            python -m poller.store validate
            git add data/
            if git diff --cached --quiet; then
              echo "No transcription progress to record after redo; nothing left to push."
              exit 0
            fi
            git commit -m "chore(data): record transcription progress [skip ci]"
          done
          echo "::error::failed to push ledger update after $attempts attempts"
          exit 1
