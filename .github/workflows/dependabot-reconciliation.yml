name: Dependabot monthly reconciliation

# Major dependency bumps are held (not auto-merged) so they can be reviewed
# together. Once a month this aggregates every open major Dependabot PR into a
# single tracking issue — a checklist to work through in one Claude Code pass
# rather than merging risky updates one at a time. See dependabot-auto-merge.yml
# and CLAUDE.md §6 (changelog review for major bumps).

on:
  schedule:
    # 09:00 UTC on the 1st of every month.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate open major Dependabot PRs into a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          month="$(date -u +%Y-%m)"
          title="Monthly dependency reconciliation — ${month}"

          # Open major-bump PRs raised by Dependabot.
          prs_json="$(gh pr list \
            --repo "$REPO" \
            --state open \
            --author "app/dependabot" \
            --label "dependencies:major" \
            --json number,title,url \
            --jq 'sort_by(.number)')"

          count="$(jq 'length' <<<"$prs_json")"

          # Reuse this month's issue if it already exists; otherwise open one.
          existing="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label "dependency-reconciliation" \
            --search "in:title \"${title}\"" \
            --json number \
            --jq '.[0].number // empty')"

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              # The month started with major bumps that were all resolved
              # (merged/closed) before the cron ran — reflect that instead
              # of leaving a stale checklist, but don't open a fresh issue.
              body="$(cat <<EOF
          No **major** dependency updates are outstanding for ${month}.

          ---
          _Generated by \`dependabot-reconciliation.yml\`. Re-runs update this issue in place._
          EOF
              )"
              gh issue edit "$existing" --repo "$REPO" --body "$body"
              echo "Updated tracking issue #${existing}: nothing outstanding."
            else
              echo "No open major dependency updates this month; skipping issue creation."
            fi
            exit 0
          fi

          checklist="$(jq -r '.[] | "- [ ] #\(.number) — \(.title)"' <<<"$prs_json")"

          body="$(cat <<EOF
          ${count} open **major** dependency update(s) are held for reconciliation.
          Review and apply them together (CLAUDE.md §6 — changelog review), then close this issue.

          ${checklist}

          ---
          _Generated by \`dependabot-reconciliation.yml\`. Re-runs update this issue in place._
          EOF
          )"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
            echo "Updated tracking issue #${existing}."
          else
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --label "dependency-reconciliation" \
              --body "$body"
            echo "Created tracking issue \"${title}\"."
          fi
