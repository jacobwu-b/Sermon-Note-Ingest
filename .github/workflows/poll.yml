# Polls every enabled church's RSS feed and commits any newly-discovered
# sermons to data/<church>.json, emailing about them per the church table's notify flag.
#
# Sole trigger is an external scheduler (cron-job.org) calling the
# workflow_dispatch REST API on a tight interval. GitHub's own `schedule:`
# event was dropped as a fallback (ADR-0011): it is delayed or dropped under
# GitHub's load for the same reason it was never the primary trigger, so it
# added a second trigger path to reason about without meaningfully more
# detection confidence than cron-job.org's own failure-notification email.
# See ADR-0002 (docs/decisions/0002-external-dispatch-trigger-for-polling.md)
# and ADR-0011 (docs/decisions/0011-remove-poll-schedule-fallback.md).
#
# After a successful ledger push, dispatches transcribe.yml for each church that
# had a new sermon this run, so transcription starts within this workflow's own
# cadence instead of waiting for transcribe.yml's independent weekly-backstop schedule
# (that schedule stays as the backstop if this dispatch fails or is skipped).
# See ADR-0007 (docs/decisions/0007-poll-dispatches-transcription-on-discovery.md).
#
# The Poll step also alerts, once per incident, when a church misses a Sunday or its feed
# keeps failing, recording that in data/alerts/state.json for the commit step below.
# See ADR-0025 (docs/decisions/0025-discovery-absence-alerts.md).
#
# The Poll step below also checks Sermon-Note-Pipeline's pending Claude batches
# and dispatches its pipeline.yml the moment one has ended, instead of waiting for
# Pipeline's own (much longer) cron. See ADR-0010
# (docs/decisions/0010-poll-claude-batches-from-ingest.md).
#
# The poll job runs third-party code (feedparser on untrusted feeds, the anthropic SDK), so it
# never holds the deploy key that bypasses main's ruleset: it uploads its data/ writes, and the
# push job, which installs nothing, merges them onto the tip and pushes (ADR-0027).

name: Poll church feeds

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Seed the ledger from full feed history, without sending any notification."
        type: boolean
        default: false
      church:
        description: "Only poll this church (its key in the church table). Leave blank for every enabled church."
        type: string
        default: ""

# Only one poll run at a time. A new dispatch queues behind an in-flight run
# rather than canceling it — frequent external dispatches must not pre-empt a
# run before it can commit; timeout-minutes below bounds the worst case.
concurrency:
  group: poll-church-feeds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    name: Poll
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # id-token: write (ADR-0087): lets this job request a GitHub OIDC token to
    # exchange for Anthropic Workload Identity Federation auth (the batch-status
    # check below). The Console-side federation rule is scoped to
    # `ref:refs/heads/main` only, so the env below gates the federation vars on
    # github.ref rather than relying on the Console rule alone to fail closed.
    permissions:
      contents: read
      id-token: write
    outputs:
      discovered: ${{ steps.poll.outputs.discovered }}
    steps:
      # ref: the live branch tip, not the default github.sha (the commit as of dispatch):
      # a run queued behind another must read the discovery alert state that run recorded,
      # or it re-sends the same alert (ADR-0025).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"
          # The default key hashes requirements.txt and names no workflow, so transcribe.yml
          # would share it and could restore a cache without its Whisper wheels.
          cache-dependency-path: requirements-poll.txt

      # The poll lock, not requirements.txt: this job imports only feedparser and anthropic,
      # and the transcription stack would add ~20 packages next to its secrets.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-poll.txt

      - name: Poll
        id: poll
        env:
          # Read as shell variables below, never interpolated directly into the
          # script — `${{ inputs.x }}` inside `run:` is text substitution before
          # the shell sees it, so an unvalidated dispatch input would otherwise
          # run as code with access to every secret in this job.
          BACKFILL: ${{ inputs.backfill }}
          CHURCH: ${{ inputs.church }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PIPELINE_REPO: ${{ vars.PIPELINE_REPO }}
          PIPELINE_DISPATCH_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Literal strings, not repository variables (ADR-0087, ADR-0010): none of
          # the four is a secret on its own, and a repository variable would render
          # on every branch regardless of the rule's own main-only scope. Gated on
          # github.ref so a feature-branch run gets a clean fallback to
          # ANTHROPIC_API_KEY instead of a denied exchange.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ github.ref == 'refs/heads/main' && 'fdrl_01DwaM4pBCr8UkPuKAvbzYmt' || '' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ github.ref == 'refs/heads/main' && '65b14891-0386-45a7-a760-1f0739bc0cee' || '' }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ github.ref == 'refs/heads/main' && 'svac_01CDFfTYqT39Gx5BXgRXBGHt' || '' }}
          ANTHROPIC_WORKSPACE_ID: ${{ github.ref == 'refs/heads/main' && 'wrkspc_01CzT9ik9bv58XyTBxKUNs2F' || '' }}
        run: |
          if [ -n "$CHURCH" ] && ! [[ "$CHURCH" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "::error::CHURCH input '$CHURCH' is not a valid church key"
            exit 1
          fi
          args=()
          if [ "$BACKFILL" = "true" ]; then
            args+=(--backfill)
          fi
          if [ -n "$CHURCH" ]; then
            args+=(--church "$CHURCH")
          fi
          # Captured via redirection (not a pipe) so `poll_exit` is this command's own
          # status, and the exit is deferred past recording `discovered` so a partial
          # failure (e.g. one church's notification) still reports the churches that
          # did succeed (ADR-0007) — mirroring how the staging step below already
          # tolerates a non-zero Poll exit for the same reason.
          set +e
          python -m poller.runner "${args[@]}" --print-discovered > /tmp/poll_discovered.txt
          poll_exit=$?
          set -e
          echo "discovered=$(cat /tmp/poll_discovered.txt)" >> "$GITHUB_OUTPUT"
          exit "$poll_exit"

      # Always, even if Poll exited non-zero (e.g. one church's notification failed):
      # poll_church() writes each church's ledger before notifying, so one failure must not
      # discard every church's discoveries, and a dropped notified_at re-sends its email.
      - name: Stage ledger changes
        if: always()
        run: python -m poller.ledger_push stage "$RUNNER_TEMP/ledger"

      - name: Upload ledger changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ledger-poll
          path: ${{ runner.temp }}/ledger
          if-no-files-found: error
          retention-days: 7

  # The only job holding DEPLOY_KEY: main's ruleset requires a PR from everyone else, and this
  # key is the one actor on its bypass list. So it installs nothing and runs this repo's code
  # without site-packages (`python -E -S`), and pushes only the allowlisted ledger files
  # (ADR-0027). A rejected push re-merges onto the fresh tip rather than re-polling, so no email
  # is sent twice.
  push:
    name: Push ledger
    needs: poll
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # No pip cache: nothing is installed, and a cache a producer job saved is not restored here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ledger-poll
          path: ${{ runner.temp }}/ledger/poll

      - name: Commit newly-discovered sermons
        id: commit
        env:
          LEDGER_DIR: ${{ runner.temp }}/ledger
          EXPECTED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          attempts=3
          landed=false
          for attempt in $(seq 1 "$attempts"); do
            python -E -S -m poller.ledger_push apply "$LEDGER_DIR"
            git add data/
            python -E -S -m poller.ledger_push check-staged
            if git diff --cached --quiet; then
              echo "No new sermons discovered this run."
              landed=true
              break
            fi
            git commit -q -m "chore(data): record poll results [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              landed=true
              break
            fi
            echo "push rejected (attempt $attempt/$attempts); merging onto the latest $GITHUB_REF_NAME and retrying"
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
          done
          if [ "$landed" != true ]; then
            echo "::error::failed to push ledger update after $attempts attempts"
            exit 1
          fi
          found=$(find "$LEDGER_DIR" -name ledger-base | wc -l | tr -d ' ')
          if [ "$found" != "$EXPECTED" ]; then
            echo "::error::$found of $EXPECTED staged ledger artifacts arrived; the rest were not recorded"
            exit 1
          fi

      - name: Dispatch transcription for newly-discovered churches
        # Best-effort latency optimization, not a correctness dependency (ADR-0007):
        # transcribe.yml's own backstop schedule still catches anything this misses, so a
        # dispatch failure here warns and moves on rather than failing the job. Runs
        # only once the ledger update for this run's discoveries actually landed on
        # main — dispatching against a push that failed would have transcribe.yml find
        # nothing pending.
        if: always() && steps.commit.outcome == 'success' && needs.poll.outputs.discovered != ''
        env:
          GH_TOKEN: ${{ secrets.TRANSCRIBE_DISPATCH_TOKEN }}
          DISCOVERED: ${{ needs.poll.outputs.discovered }}
        run: |
          IFS=',' read -ra churches <<< "$DISCOVERED"
          for church in "${churches[@]}"; do
            echo "dispatching transcription for $church"
            if ! gh workflow run transcribe.yml --repo "${{ github.repository }}" -f church="$church"; then
              echo "::warning::failed to dispatch transcription for $church; the backstop schedule will still catch it"
            fi
          done
