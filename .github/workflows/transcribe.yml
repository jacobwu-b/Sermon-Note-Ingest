# Transcribes pending sermons with faster-whisper and pushes each transcript
# directly to the private Sermon-Note-Content repo, then commits this repo's own
# ledger update (transcription_status/transcript_hash/content_path) to data/.
#
# Runs independently of poll.yml: Whisper transcription cannot fit inside that
# job's 4-minute budget. --limit bounds each run's cost (spec 0003, ADR-0004);
# raise the schedule's frequency or workflow_dispatch's limit to work down a
# backlog faster, rather than removing the cap.
#
# `shards` (ADR-0005) splits one bounded run into that many parallel matrix legs,
# each a disjoint slice of the same selection (poller/transcriber.py
# --shard-index/--shard-count) — for a large manual backfill only. The scheduled
# run always uses a single shard: at the typical weekly volume, an extra shard's
# fixed per-job setup cost (checkout, dependency install, cache restore) buys no
# real parallelism benefit.

name: Transcribe sermons

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum sermons to transcribe this run, across all selected churches."
        type: number
        default: 5
      church:
        description: "Only transcribe this church (its CHURCHES key). Leave blank for every enabled church."
        type: string
        default: ""
      shards:
        description: "Split this run into this many parallel shards (backfill only; leave at 1 otherwise)."
        type: number
        default: 1

# Separate from poll.yml's group: transcription and polling never need to block
# each other. Both still write data/ — see the push step below for how that race
# is handled.
concurrency:
  group: transcribe-sermons
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHURCHES: ${{ vars.CHURCHES }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
  WHISPER_COMPUTE_TYPE: ${{ vars.WHISPER_COMPUTE_TYPE }}
  CONTENT_REPO: ${{ vars.CONTENT_REPO }}
  CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
  # Read directly by huggingface_hub (faster-whisper's model download), not by our own
  # code — authenticates the weight download so it isn't subject to Hugging Face's
  # anonymous rate limit.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  # Turns the `shards` input into the matrix `transcribe` fans out over. A separate
  # job (rather than a static matrix in transcribe.yml) because the shard count is
  # only known at dispatch time — `schedule` runs carry no `inputs`, so this always
  # falls back to a single shard for them.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      - name: Compute shard indices
        id: compute
        run: |
          count="${{ inputs.shards || 1 }}"
          if [ "$count" -lt 1 ]; then
            count=1
          fi
          shards="["
          for ((i = 0; i < count; i++)); do
            shards+="$i"
            if [ "$i" -lt "$((count - 1))" ]; then
              shards+=","
            fi
          done
          shards+="]"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  transcribe:
    name: Transcribe (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # No timeout-minutes: large-v3 run length varies enough that a fixed cap keeps
    # cutting runs off before they finish. Public repo — GitHub-hosted runner
    # minutes are unmetered, so the usual §13 cost-ceiling rationale doesn't apply;
    # GitHub's own default job cap (6h) still bounds a truly stuck runner.
    # One shard failing (a crashed runner, a terminal model error) must not cancel
    # the others — each is an independent slice of the backlog, per ADR-0005.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      # Deploy key authenticates this repo's own ledger push, same as poll.yml.
      # It is unrelated to CONTENT_REPO_TOKEN, which authenticates the separate
      # push to Sermon-Note-Content inside the transcriber itself.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # faster-whisper downloads model weights from the Hugging Face hub on first
      # use; caching them here means a scheduled run doesn't re-fetch on every
      # invocation (§13 unattended cost). Shared across shards: a cold cache means
      # each shard downloads once in parallel, a one-time cost, not a per-run one.
      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Transcribe
        run: |
          args=(--limit "${{ inputs.limit || 5 }}" --shard-index "${{ matrix.shard }}" --shard-count "${{ inputs.shards || 1 }}")
          if [ -n "${{ inputs.church }}" ]; then
            args+=(--church "${{ inputs.church }}")
          fi
          echo "TRANSCRIBE_ARGS=${args[*]}" >> "$GITHUB_ENV"
          python -m poller.transcriber "${args[@]}"

      - name: Push ledger update
        # Always runs, even if Transcribe exited non-zero (e.g. one sermon's model
        # call failed terminally): transcribe_church() writes each church's ledger
        # to disk before returning, so one failure must not discard every other
        # church's progress. poll.yml also commits data/ on its own schedule, and
        # every other shard in this same matrix does too — rather than a textual
        # git rebase on a file every writer rewrites whole (likely to conflict),
        # reset to the fresh main and re-run this shard's transcriber invocation:
        # it is idempotent (a sermon already "done" or already landed in Content is
        # never re-marked or re-pushed with new content), so redoing this shard's
        # batch on top of latest main is always safe, just occasionally wasted CPU
        # time. More shards means more concurrent writers, so the retry budget
        # scales with shard count (ADR-0005) rather than staying fixed at 3.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          attempts="${{ inputs.shards || 1 }}"
          attempts=$((attempts + 1))
          if [ "$attempts" -lt 3 ]; then
            attempts=3
          fi
          for attempt in $(seq 1 "$attempts"); do
            git add data/
            if git diff --cached --quiet; then
              echo "No transcription progress to record this run."
              exit 0
            fi
            git commit -m "chore(data): record transcription progress [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/$attempts); re-syncing with main and retrying"
            git fetch origin main
            git reset --hard origin/main
            python -m poller.transcriber $TRANSCRIBE_ARGS || true
          done
          echo "::error::failed to push ledger update after $attempts attempts"
          exit 1
